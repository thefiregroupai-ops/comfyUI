<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#090a0f">
  <title>Page Not Found | FIRE AI</title>
  <link rel="icon" href="/comfyUI/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #f7f7fb; background: radial-gradient(circle at top, #25134b, #090a0f 55%); }
    main { width: min(42rem, calc(100% - 2rem)); padding: 3rem; text-align: center; border: 1px solid #3c3156; border-radius: 1.25rem; background: rgb(16 17 25 / 88%); }
    p { color: #c8c5d2; line-height: 1.7; }
    .code { color: #b99cff; font-size: .875rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: .6rem 0; font-size: clamp(2rem, 8vw, 4rem); }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 2rem; }
    a { padding: .8rem 1rem; color: #fff; font-weight: 700; text-decoration: none; border: 1px solid #6f55a5; border-radius: .65rem; background: #24163e; }
    a:hover, a:focus-visible { outline: 2px solid #d4c1ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code">Error 404</div>
    <h1>Workflow not found</h1>
    <p>The page may have moved, but the workflow catalog is still here. Browse by model family or start with the JSON import guide.</p>
    <nav aria-label="Recovery links">
      <a href="/comfyUI/">Home</a>
      <a href="/comfyUI/workflows/">Browse workflows</a>
      <a href="/comfyUI/guides/how-to-install-comfyui-workflow-json/">Import guide</a>
    </nav>
  </main>
</body>
</html>
